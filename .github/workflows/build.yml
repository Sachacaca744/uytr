
name: Build Minecraft Forge Mod

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Trouver et compiler le mod
        shell: bash
        run: |
          GRADLEW=$(find . -type f -name gradlew \
            -not -path './.git/*' -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERREUR : fichier gradlew introuvable."
            echo "Vérifiez que le projet Forge est bien présent."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "Projet trouvé : $PROJECT_DIR"

          chmod +x "$GRADLEW"
          cd "$PROJECT_DIR"
          ./gradlew build

      - name: Télécharger le JAR
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Forge-Mod
          path: '**/build/libs/*.jar'
          if-no-files-found: error
