plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
version = '1.0.0'
group = 'com.uninu.mod'
base { archivesName = 'uninu-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client { workingDirectory project.file('run'); mods { uninu { source sourceSets.main } } }
        server { workingDirectory project.file('run'); args '--nogui'; mods { uninu { source sourceSets.main } } }
    }
}
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.3.0' }
tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
